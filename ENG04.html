<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP | Shruti & Akshay</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5F6B5E; /* Dark Sage from invitation text */
            --bg: #F9F7F2;      /* Cream background */
            --text: #2C2C2C;
            --border: #E5E0D5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* The Main Wrapper for Side-by-Side */
        .main-wrapper {
            display: flex;
            flex-direction: row; /* Side by side */
            background: white;
            max-width: 950px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* Left Side: The Poster */
        .poster-section {
            flex: 1;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border);
        }

        .poster-section img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the image fills the area beautifully */
        }

        /* Right Side: The Form */
        .form-section {
            flex: 0.80;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-style: italic;
            text-align: center;
        }

        .subtitle {
            font-size: 0.85rem;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            color: #888;
        }

        .info-note {
            font-size: 0.8rem;
            line-height: 1.5;
            padding: 1rem;
            background: #FAF9F6;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: -5px;
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Mobile Responsive: Stack them on top of each other on small screens */
        @media (max-width: 768px) {
            .main-wrapper {
                flex-direction: column;
                margin-top: 20px;
            }
            .poster-section {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="poster-section">
        <img src="invitation_sa.png" alt="Shruti and Akshay Invitation">
    </div>

    <div class="form-section">
        <h1>Engagement Celebration</h1>
        <p class="subtitle">PLEASE RSVP BY MARCH 6, 2026</p>

        <div class="info-note">
            <strong>Dress Code:</strong> Indian Traditional<br>
            <span style="font-style: italic; color: #666;">Should you wish to honor us with a gift, we kindly request no boxed gifts.</span>
        </div>

        <form action="https://formspree.io/f/xreaoney" method="POST">
            <label>Guest Full Name</label>
            <input type="text" name="name_1" placeholder="Guest Name" required>

            <label>Will you attend?</label>
            <select name="attendance_1" required>
                <option value="yes">Will Attend</option>
                <option value="no">Regretfully Decline</option>
            </select>

            <label>Guest 2 Full Name</label>
            <input type="text" name="name_2" placeholder="Guest Name" required>

            <label>Will you attend?</label>
            <select name="attendance_2" required>
                <option value="yes">Will Attend</option>
                <option value="no">Regretfully Decline</option>
            </select>

            <label>Guest 3 Full Name</label>
            <input type="text" name="name_3" placeholder="Guest Name" required>

            <label>Will you attend?</label>
            <select name="attendance_3" required>
                <option value="yes">Will Attend</option>
                <option value="no">Regretfully Decline</option>
            </select>
            
            <label>Dietary Notes</label>
            <textarea name="dietary" rows="2" placeholder="Allergies or preferences?"></textarea>

            <button type="submit">Send Response</button>
        </form>
    </div>
</div>

</body>
</html>
