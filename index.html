<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP | Shruti & Akshay Engagement Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8DACBF; /* Sage/Dusty Blue */
            --accent: #efd3d7;  /* Soft Rose */
            --text: #4a4a4a;
            --bg: #fdfcfb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 1px solid #f1f1f1;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        p.subtitle {
            font-style: italic;
            margin-bottom: 2rem;
            color: #888;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            text-align: left;
        }

        label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: -0.5rem;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: black;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #7a869a;
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #bbb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Shruti & Akshay's Engagement Celebration</h1>
    <p class="subtitle">Please RSVP by March 6th 2026</p>

    <form action="https://formspree.io/f/xreaoney" method="POST">
        <label>Guest Full Name</label>
        <input type="text" name="name" placeholder="Guest Name" required>

        <label>Will you attend?</label>
        <select name="attendance" required>
            <option value="yes">Will Attend</option>
            <option value="no">Regretfully Decline</option>
        </select>

        <label>Guest 2 Full Name</label>
        <input type="text" name="name" placeholder="Guest Name" required>

        <label>Will you attend?</label>
        <select name="attendance" required>
            <option value="yes">Will Attend</option>
            <option value="no">Regretfully Decline</option>
        </select>

        <label>Dietary Notes</label>
        <textarea name="dietary" rows="3" placeholder="Allergies or preferences?"></textarea>

        <button type="submit">Send Response</button>
    </form>

    <p class="footer-note">We can't wait to celebrate with you!</p>
</div>

</body>
</html>
